# Veröffentlicht die Website auf GitHub Pages, und zwar beide Versionen in einem Deployment:
#   alte Seite aus Branch main  →  https://fralineel-kiesel.github.io/kiesel-website/
#   Kiesel 2.0 aus Branch v2    →  https://fralineel-kiesel.github.io/kiesel-website/v2/
# Voraussetzung: Settings › Pages › Source = "GitHub Actions".
#
# Bewusst OHNE Tests: Der Workflow baut nur (npm run build) und veröffentlicht. Stoppen kann
# ihn also nur ein Fehler beim Bauen. Die Prüfskripte (npm run pruefe:…) laufen lokal vor dem
# Pull Request; viele brauchen einen Browser und messen Zeit oder Pixel, und so etwas soll nie
# eine Veröffentlichung blockieren. Wer hier Tests ergänzt: nur deterministische (z.B.
# pruefe:waechter, pruefe:zeichenmotor), keine Messungen wie leistung:startseite oder lighthouse.

name: GitHub Pages

on:
  push:
    branches: [main, v2]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - name: Alte Seite aus main holen
        uses: actions/checkout@v7
        with:
          ref: main
          path: alt

      - name: Kiesel 2.0 aus v2 holen
        uses: actions/checkout@v7
        with:
          ref: v2
          path: neu

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: neu/site/package-lock.json

      - name: Pakete installieren
        working-directory: neu/site
        run: npm ci

      - name: Kiesel 2.0 bauen
        working-directory: neu/site
        run: npm run build

      - name: Beide Seiten zusammenlegen
        run: |
          cp -R alt _site
          rm -rf _site/.git _site/.github
          mkdir _site/v2
          cp -R neu/site/dist/. _site/v2/

      - name: Pages vorbereiten
        uses: actions/configure-pages@v6

      - name: Ergebnis hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}v2/
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
